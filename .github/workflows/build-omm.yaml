name: Build SM74 Android APK

on:
  push:
    branches: [ sm74 ] # 确保只监听 sm74 分支
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: sm74
          submodules: recursive

      # 环境配置...
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Install Host Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libglew-dev

      - name: Prepare ROM
        run: |
          cp baserom.us.z64 app/jni/src/baserom.us.z64 || true
          cp baserom.us.z64 . || true

      - name: Get SDL Dependencies
        run: |
          if [ -f "getSDL.sh" ]; then
            chmod +x getSDL.sh
            ./getSDL.sh
          fi

      # 编译核心
      - name: Native Build
        run: |
          echo "当前目录:"
          pwd
          ls -la
          
          # 直接在当前目录 make
          make clean || true
          make -j$(nproc) || true
          make -j$(nproc)
          
          echo "查找编译出的 so 文件:"
          find . -name "*.so"
